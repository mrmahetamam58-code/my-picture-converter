<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HD Picture Converter</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.wrap{max-width:760px;margin:auto;padding:28px 16px}.card{background:white;border-radius:22px;padding:24px;box-shadow:0 10px 35px #00000012}
h1{text-align:center;margin:5px 0 8px;font-size:30px}.sub{text-align:center;color:#687386;margin:0 0 24px}
.drop{border:2px dashed #aeb8c8;border-radius:18px;padding:38px 15px;text-align:center;cursor:pointer;background:#fafcff}
.drop.drag{border-color:#3367d6;background:#eef4ff}.icon{font-size:44px}.drop strong{display:block;font-size:18px;margin:8px}
input[type=file]{display:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
label{font-size:13px;color:#5d6878}select,input[type=number]{width:100%;margin-top:6px;padding:12px;border:1px solid #d6dce5;border-radius:10px;background:white;font-size:15px}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px}.check input{width:auto}
.preview{margin-top:20px;text-align:center}.preview img{max-width:100%;max-height:420px;border-radius:14px;display:none;margin:auto}
.info{margin-top:12px;color:#667085;font-size:13px}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:18px;font-size:16px;font-weight:bold;cursor:pointer;background:#2463eb;color:white}
button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#edf2f8;color:#172033}
.note{font-size:12px;color:#778195;text-align:center;margin-top:16px;line-height:1.5}
@media(max-width:560px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>HD Picture Converter</h1>
<p class="sub">Upscale, enhance and convert your image directly in your browser.</p>

<label class="drop" id="drop">
<div class="icon">🖼️</div>
<strong>Choose a picture</strong>
<span>JPG, PNG or WebP • or drag & drop</span>
<input id="file" type="file" accept="image/*">
</label>

<div class="controls">
<div><label>HD size</label>
<select id="scale">
<option value="1">Original size</option><option value="1.5">150% larger</option>
<option value="2" selected>2× HD</option><option value="3">3× HD</option><option value="4">4× HD</option>
</select></div>
<div><label>Output format</label>
<select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp" selected>WebP</option></select></div>
</div>

<label class="check"><input type="checkbox" id="enhance" checked> Apply light sharpness enhancement</label>

<div class="preview"><img id="preview"><div class="info" id="info">No image selected.</div></div>
<button id="convert" disabled>Convert & Download HD Image</button>
<button class="secondary" id="reset" type="button">Choose Another Picture</button>
<p class="note">Your image is processed locally in your browser. It is not uploaded to a server.</p>
</div>
</div>

<script>
const file=document.getElementById('file'),drop=document.getElementById('drop'),preview=document.getElementById('preview');
const info=document.getElementById('info'),convert=document.getElementById('convert');
let image=null,name='image';

drop.onclick=()=>file.click();
file.onchange=()=>load(file.files[0]);
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>load(e.dataTransfer.files[0]));

function load(f){
 if(!f||!f.type.startsWith('image/')) return;
 name=f.name.replace(/\.[^.]+$/,'');
 const url=URL.createObjectURL(f); const im=new Image();
 im.onload=()=>{image=im;preview.src=url;preview.style.display='block';
 info.textContent=`Original: ${im.naturalWidth} × ${im.naturalHeight}px • ${Math.round(f.size/1024)} KB`;
 convert.disabled=false;};
 im.src=url;
}
convert.onclick=()=>{
 if(!image)return;
 const scale=+document.getElementById('scale').value;
 const type=document.getElementById('format').value;
 const c=document.createElement('canvas'),ctx=c.getContext('2d');
 c.width=Math.min(Math.round(image.naturalWidth*scale),10000);
 c.height=Math.min(Math.round(image.naturalHeight*scale),10000);
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 ctx.drawImage(image,0,0,c.width,c.height);
 if(document.getElementById('enhance').checked){
   const tmp=document.createElement('canvas');tmp.width=c.width;tmp.height=c.height;
   const t=tmp.getContext('2d');t.filter='contrast(1.04) saturate(1.03)';t.drawImage(c,0,0);
   ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(tmp,0,0);
 }
 c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
 const ext=type==='image/png'?'png':type==='image/jpeg'?'jpg':'webp';
 a.download=name+'_hd.'+ext;a.click();URL.revokeObjectURL(a.href);
 },type,type==='image/jpeg'?0.94:0.95);
};
document.getElementById('reset').onclick=()=>{file.value='';image=null;preview.style.display='none';info.textContent='No image selected.';convert.disabled=true};
</script>
</body>
</html>
